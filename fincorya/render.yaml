# Render Blueprint — FINCORYA
# https://render.com/docs/blueprint-spec
#
# Deploiement complet : service web + PostgreSQL + disque persistant.
# Le deploiement ne crée AUCUNE donnee metier : l'administrateur doit
# configurer manuellement les comptes, parties prenantes, caisses et
# soldes d'ouverture apres la premiere mise en production.

databases:
  - name: fincorya-db
    databaseName: fincorya
    user: fincorya_app
    plan: starter
    ipAllowList: []  # Accessible uniquement depuis les services Render

services:
  - type: web
    name: fincorya
    runtime: python
    rootDir: fincorya
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --chdir fincorya --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: MFA_ENABLED
        value: "True"
      - key: LOCAL_AUTH_BYPASS
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_SECRET_KEY
        sync: false  # Définir manuellement dans le dashboard Render
      - key: DEFAULT_FROM_EMAIL
        value: "FINCORYA <noreply@fincorya.com>"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: BUSINESS_TIME_ZONE
        value: "Europe/Istanbul"
      - key: FINANCE_LEDGER_ENABLED
        value: "False"
      - key: REPORT_RETENTION_DAYS
        value: "365"
      - key: DATABASE_URL
        fromDatabase:
          name: fincorya-db
          property: connectionString
      - key: MEDIA_ROOT
        value: "/opt/render/media"
    disk:
      name: fincorya-media
      mountPath: /opt/render/media
      sizeGB: 5
