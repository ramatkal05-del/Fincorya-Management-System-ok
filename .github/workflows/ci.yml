name: FINCORYA quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fincorya_ci
          POSTGRES_USER: fincorya_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fincorya_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: fincorya
    env:
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: fincorya_ci
      DB_USER: fincorya_ci
      DB_PASSWORD: ci-only-password
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      MFA_ENABLED: "True"
      LOCAL_AUTH_BYPASS: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fincorya/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
