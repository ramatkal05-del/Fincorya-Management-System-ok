# Render Blueprint — FINCORYA
# https://render.com/docs/blueprint-spec
#
# Deploiement complet : service web + PostgreSQL + disque persistant.
# Le deploiement ne crée AUCUNE donnee metier : l'administrateur doit
# configurer manuellement les comptes, parties prenantes, caisses et
# soldes d'ouverture apres la premiere mise en production.

databases:
  - name: fincorya-db
    databaseName: fincorya
    user: fincorya_app
    plan: starter
    ipAllowList: []

services:
  - type: web
    name: fincorya
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    preDeployCommand: "cd fincorya && python manage.py migrate --noinput"
    startCommand: "cd fincorya && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: MFA_ENABLED
        value: "True"
      - key: LOCAL_AUTH_BYPASS
        value: "False"
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: fincorya.com,www.fincorya.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fincorya.com,https://www.fincorya.com
      - key: BUSINESS_TIME_ZONE
        value: Europe/Istanbul
      - key: FINANCE_LEDGER_ENABLED
        value: "False"
      - key: REPORT_RETENTION_DAYS
        value: "365"
      - key: ADMIN_PASSWORD
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DEFAULT_FROM_EMAIL
        value: "FINCORYA <noreply@fincorya.com>"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DB_NAME
        fromDatabase: {name: fincorya-db, property: database}
      - key: DB_USER
        fromDatabase: {name: fincorya-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: fincorya-db, property: password}
      - key: DB_HOST
        fromDatabase: {name: fincorya-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: fincorya-db, property: port}
    disk:
      name: fincorya-private-files
      mountPath: /var/data
      sizeGB: 10

  # Traite en continu la file de notifications (apps.notifications) : envoie
  # les e-mails persistés par notify(), avec retries et backoff exponentiel.
  # Sans ce service, les notifications restent PENDING indéfiniment.
  - type: worker
    name: fincorya-notification-worker
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "cd fincorya && python manage.py notification_worker"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: BUSINESS_TIME_ZONE
        value: Europe/Istanbul
      - key: SITE_URL
        value: https://fincorya.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEFAULT_FROM_EMAIL
        value: "FINCORYA <noreply@fincorya.com>"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DB_NAME
        fromDatabase: {name: fincorya-db, property: database}
      - key: DB_USER
        fromDatabase: {name: fincorya-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: fincorya-db, property: password}
      - key: DB_HOST
        fromDatabase: {name: fincorya-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: fincorya-db, property: port}

  # Vérifie toutes les 15 minutes s'il faut déclencher le rappel hebdomadaire
  # des agents (fenêtre "clôture configurée - N heures"). La commande est un
  # no-op hors fenêtre et idempotente par agent/date de clôture.
  - type: cron
    name: fincorya-weekly-agent-reminder
    runtime: python
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: "./build.sh"
    startCommand: "cd fincorya && python manage.py send_weekly_agent_reminders"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: BUSINESS_TIME_ZONE
        value: Europe/Istanbul
      - key: SITE_URL
        value: https://fincorya.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_NAME
        fromDatabase: {name: fincorya-db, property: database}
      - key: DB_USER
        fromDatabase: {name: fincorya-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: fincorya-db, property: password}
      - key: DB_HOST
        fromDatabase: {name: fincorya-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: fincorya-db, property: port}
